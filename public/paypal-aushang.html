<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayPal Mannschaftskasse</title>
  <!-- Druckvorlage (A4). Der QR-Code zeigt auf https://paypal.me/FSGOTW. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --pp-navy: #003087;
      --pp-blue: #009cde;
      --muted: #5b6375;
    }

    @page { size: A4; margin: 0; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #d9dde6;
      font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .toolbar {
      max-width: 210mm;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 14px;
      color: var(--muted);
    }

    .toolbar button {
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      background: var(--pp-navy);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 16px auto;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14mm;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5mm;
    }

    .brand svg { width: 24mm; height: 24mm; }

    .brand span {
      font-size: 54pt;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.02em;
      color: var(--pp-navy);
    }

    .brand span b { font-weight: inherit; color: var(--pp-blue); }

    h1 {
      margin: -6mm 0 0;
      font-size: 40pt;
      font-weight: 800;
      color: #1b1f2a;
    }

    .qr {
      width: 130mm;
      padding: 9mm;
      border: 3px solid var(--pp-navy);
      border-radius: 8mm;
    }

    .qr svg { width: 100%; height: auto; display: block; }

    @media print {
      html, body { background: #fff; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }

    @media screen and (max-width: 840px) {
      .sheet { zoom: 0.45; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Drucken</button>
    <span>A4, Hochformat, ohne Ränder. „Hintergrundgrafiken“ im Druckdialog aktivieren.</span>
  </div>

  <main class="sheet">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#003087" d="M15.607 4.653H8.941L6.645 19.251H1.82L4.862 0h7.995c3.754 0 6.375 2.294 6.473 5.513-.648-.478-2.105-.86-3.722-.86"/>
        <path fill="#009cde" d="M22.177 10.199c0 3.41-3.01 6.853-6.958 6.853h-2.493L11.595 24H6.74l1.845-11.538h3.592c4.208 0 7.346-3.634 7.153-6.949a5.24 5.24 0 0 1 2.848 4.686"/>
        <path fill="#012169" d="M9.653 5.546h6.408c.907 0 1.942.222 2.363.541-.195 2.741-2.655 5.483-6.441 5.483H8.714Z"/>
      </svg>
      <span>Pay<b>Pal</b></span>
    </div>
    <h1>Mannschaftskasse</h1>
    <div class="qr" id="qr"></div>
  </main>

  <script>
    (function () {
      try {
        var qr = qrcode(0, "M");
        qr.addData("https://paypal.me/FSGOTW");
        qr.make();
        document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      } catch (e) {
        document.getElementById("qr").textContent = "QR-Code konnte nicht geladen werden.";
      }
    })();
  </script>
</body>
</html>
